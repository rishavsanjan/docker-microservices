apiVersion: apps/v1

kind: Deployment

metadata:
  name: analytics-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: analytics-service

  template:
    metadata:
      labels:
        app: analytics-service

    spec:
      containers:
        - name: analytics-service
          image: docker-microservices-analytics-service:latest
          imagePullPolicy: IfNotPresent

          readinessProbe:
            httpGet:
              path: /
              port: 6001
            initialDelaySeconds: 5
            periodSeconds: 10

            readinessProbe:
              httpGet:
                path: /
                port: 6001
              initialDelaySeconds: 5
              periodSeconds: 10

          ports:
            - containerPort: 6001
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
