apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: url-shortener

spec:
  serviceName: web
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          volumeMounts:
            - name: web-data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: web-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 100Mi